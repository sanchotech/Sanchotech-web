
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starr AI — Sancho Tech</title>
  <meta name="description" content="Starr AI by Sancho Tech">

  <style>
    :root {
      --yellow: #ffd400;
      --blue: #1683ff;
      --black: #050509;
      --card: #101017;
      --text: #ffffff;
      --muted: #a5a5b5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #1b1b2b 0%, transparent 45%),
        var(--black);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--yellow), #ff9d00);
      color: #080808;
      font-size: 42px;
      font-weight: 900;
      box-shadow: 0 0 35px rgba(255, 212, 0, .2);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(255, 212, 0, .35);
      border-radius: 999px;
      color: var(--yellow);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(36px, 8vw, 62px);
      line-height: 1;
      letter-spacing: -2px;
    }

    h1 span {
      color: var(--yellow);
    }

    .subtitle {
      margin: 0 auto 30px;
      max-width: 460px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .card {
      padding: 28px;
      border: 1px solid #292936;
      border-radius: 24px;
      background: linear-gradient(145deg, #15151e, #0b0b10);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .35);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .card p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      transition: .2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: var(--yellow);
      color: #080808;
    }

    .secondary {
      border: 1px solid #353544;
      background: #191923;
      color: white;
    }

    .primary:hover {
      background: #ffe45b;
    }

    .secondary:hover {
      border-color: var(--blue);
      background: #20202d;
    }

    .footer {
      margin-top: 28px;
      color: #777789;
      font-size: 13px;
    }

    .footer strong {
      color: var(--yellow);
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .card {
        padding: 22px 18px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">✦</div>

    <div class="badge">Sancho Tech AI</div>

    <h1>Starr <span>AI</span></h1>

    <p class="subtitle">
      Your intelligent AI experience, powered by Starr AI.
      Explore the application and discover what it can do.
    </p>

    <section class="card">
      <h2>Welcome to Starr AI</h2>
      <p>
        Access the live Starr AI application below.
      </p>

      <div class="buttons">
        <a
          class="btn primary"
          href="https://callmestarr.netlify.app/"
          target="_blank"
          rel="noopener noreferrer"
        >
          🚀 Open Starr AI
        </a>

        <a class="btn secondary" href="index.html">
          ← Back to Sancho Tech
        </a>
      </div>
    </section>

    <div class="footer">
      Developed by <strong>Sancho Tech</strong>
    </div>
  </main>
</body>
</html>
